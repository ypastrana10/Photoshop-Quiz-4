<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Photoshop Certification Quiz — Part 4</title>
<style>
*{box-sizing:border-box}body{font:16px Arial,sans-serif;background:#f0f4f9;color:#192d43;margin:0;padding:22px}main{max-width:850px;margin:auto}h1{color:#075ca5}.question{background:white;border:1px solid #d7dfeb;border-radius:12px;padding:20px;margin:15px 0}.option{display:block;background:#f6f8fb;border:1px solid #d9e0e9;padding:12px;margin:8px 0;border-radius:8px;cursor:pointer}.option:has(input:checked){background:#e4f2ff;border-color:#087bc1}.option.correct{background:#dcf6e7;border-color:#238354}.option.wrong{background:#ffe4e4;border-color:#bd3434}button{background:#087bc1;color:white;border:0;border-radius:7px;padding:12px 20px;font-weight:bold;cursor:pointer;margin:12px 6px 12px 0}.secondary{background:#52677e}#result{font-size:21px;font-weight:bold;margin:15px 0}#notice{color:#ad302c;font-weight:bold}small{color:#536477}.feedback{font-size:14px;font-weight:bold;margin-top:10px}.actions{margin:20px 0}@media print{button,#notice{display:none}.question{break-inside:avoid}body{background:white}}
</style></head><body><main><h1>Adobe Photoshop Certification Practice Quiz — Part 4</h1><p>20 questions • Select the required number of answers for each question. Submit to see your score and correct answers.</p><p id="progress" aria-live="polite"></p><div id="quiz"></div><div class="actions"><button id="submit" type="button">Submit &amp; Grade Quiz</button><button class="secondary" id="retake" type="button">Retake Quiz</button><button class="secondary" id="print" type="button" hidden>Print Results</button></div><p id="notice" role="alert"></p><div id="result" role="status"></div></main>
<script>
const qs=[{"q": "Which statements describe valid uses of the Lasso Tool? Select all that apply.", "opts": ["Make a non-geometric selection", "Select an area before Content-Aware Fill", "Group objects from separate layers", "Select an area to remove from an image"], "ans": [0, 1, 3]}, {"q": "Which action temporarily disables a layer mask?", "opts": ["Shift-click the mask thumbnail", "Ctrl+Shift+I", "Ctrl+Shift+M", "Ctrl+Shift+H"], "ans": [0]}, {"q": "Which three features can establish hierarchy in text?", "opts": ["Fonts", "Rasterization", "Size", "Colors"], "ans": [0, 2, 3]}, {"q": "What does kerning control?", "opts": ["Space between specific character pairs", "Distance between lines of text", "Spacing across a selected range of characters", "Thickness of a font"], "ans": [0]}, {"q": "What is the best definition of typography?", "opts": ["Emphasizing important text through layout", "The art of arranging type using fonts, styles, and other properties", "The emotional feeling conveyed by a font", "Aligning text to a document grid"], "ans": [1]}, {"q": "Which is a serif font?", "opts": ["Tahoma", "Times New Roman", "Calibri", "Arial"], "ans": [1]}, {"q": "Which term describes the space between two specific characters?", "opts": ["Kerning", "Alignment", "Tracking", "Leading"], "ans": [0]}, {"q": "According to the supplied practice question, which action scales a bounding box proportionately?", "opts": ["Ctrl-click a side and drag", "Ctrl+J", "Shift-drag a corner handle", "Ctrl+Alt-click a side and drag"], "ans": [2]}, {"q": "Before completing a Photoshop project, which three items should be reviewed?", "opts": ["Color mode", "Swatches", "Metadata", "Dimensions and resolution"], "ans": [0, 2, 3]}, {"q": "Which three adjustments can be made using adjustment layers?", "opts": ["Temperature via a suitable adjustment", "Curves", "Aperture", "Brightness and contrast"], "ans": [0, 1, 3]}, {"q": "Which operations are generally non-destructive? Select all that apply.", "opts": ["Using a layer mask", "Using adjustment layers", "Directly applying Image > Adjustments to pixels", "Transforming a Smart Object"], "ans": [0, 1, 3]}, {"q": "How can you apply a filter to a text layer while keeping the type editable?", "opts": ["Rasterize the type layer", "Save only as JPEG", "Convert the type layer to a Smart Object", "Flatten the document"], "ans": [2]}, {"q": "What editing approach preserves original image data?", "opts": ["Non-destructive editing", "Destructive editing", "Flattened editing", "Permanent pixel editing"], "ans": [0]}, {"q": "Which technique changes an image without overwriting original pixel data?", "opts": ["Direct pixel painting", "Destructive retouching", "Non-destructive editing", "Flattening layers"], "ans": [2]}, {"q": "Rasterizing vector content converts it into which type of content?", "opts": ["Editable vector paths", "Pixels", "Live text", "Smart guides"], "ans": [1]}, {"q": "Which Photoshop feature retains an image’s source content for non-destructive transformations?", "opts": ["Content-Aware Fill", "History panel", "Smart Objects", "Magic Wand"], "ans": [2]}, {"q": "Which operations are generally destructive when applied directly to a pixel layer? Select all that apply.", "opts": ["Image > Adjustments", "Clone Stamp directly on original pixels", "Using a layer mask", "Rasterizing vector artwork"], "ans": [0, 1, 3]}, {"q": "Which command is intended to change a photo’s sky?", "opts": ["Magic Wand", "Sky Replacement", "Paste Special", "Perspective Warp"], "ans": [1]}, {"q": "Which is NOT a selection method in Photoshop?", "opts": ["Magic Wand", "Lasso", "Hand Tool", "Quick Selection"], "ans": [2]}, {"q": "Which term means spacing between lines of text?", "opts": ["Tracking", "Leading", "Kerning", "Baseline"], "ans": [1]}];
const root=document.getElementById('quiz');
let graded=false;
function updateProgress(){const completed=qs.filter((q,i)=>document.querySelectorAll('input[name="q'+i+'"]:checked').length===q.ans.length).length;document.getElementById('progress').textContent=completed+' of '+qs.length+' questions complete';}
function build(){root.replaceChildren();qs.forEach((q,i)=>{const div=document.createElement('section');div.className='question';div.id='question-'+(i+1);const title=document.createElement('h2');title.textContent=(i+1)+'. '+q.q;const instruction=document.createElement('small');instruction.textContent=q.ans.length>1?'Select '+q.ans.length+' answers.':'Select ONE answer.';div.append(title,instruction);q.opts.forEach((o,j)=>{const lab=document.createElement('label');lab.className='option';const inp=document.createElement('input');inp.type=q.ans.length>1?'checkbox':'radio';inp.name='q'+i;inp.value=j;inp.addEventListener('change',updateProgress);lab.append(inp,document.createTextNode(' '+String.fromCharCode(65+j)+'. '+o));div.append(lab)});const feedback=document.createElement('p');feedback.className='feedback';div.append(feedback);root.append(div)});updateProgress();}
function grade(){if(graded)return;const incomplete=[];qs.forEach((q,i)=>{const n=document.querySelectorAll('input[name="q'+i+'"]:checked').length;if(n!==q.ans.length)incomplete.push(i+1)});if(incomplete.length){document.getElementById('notice').textContent='Please finish these questions (select the required number of answers): '+incomplete.join(', ')+'.';document.getElementById('question-'+incomplete[0]).scrollIntoView({behavior:'smooth',block:'start'});return;}document.getElementById('notice').textContent='';let score=0;document.querySelectorAll('.question').forEach((div,i)=>{const q=qs[i],chosen=[...div.querySelectorAll('input:checked')].map(x=>Number(x.value));const correct=chosen.length===q.ans.length&&chosen.every(x=>q.ans.includes(x));if(correct)score++;div.querySelectorAll('.option').forEach((lab,j)=>{lab.classList.toggle('correct',q.ans.includes(j));lab.classList.toggle('wrong',chosen.includes(j)&&!q.ans.includes(j))});div.querySelectorAll('input').forEach(inp=>inp.disabled=true);div.querySelector('.feedback').textContent=(correct?'Correct. ':'Incorrect. ')+'Correct answer: '+q.ans.map(j=>String.fromCharCode(65+j)+'. '+q.opts[j]).join('; ')});graded=true;document.getElementById('submit').disabled=true;document.getElementById('print').hidden=false;const result=document.getElementById('result');result.textContent='Your score: '+score+' / '+qs.length+' ('+Math.round(score/qs.length*100)+'%). Green shows correct choices; red shows incorrect selections.';result.scrollIntoView({behavior:'smooth',block:'center'});}
function retake(){graded=false;document.getElementById('submit').disabled=false;document.getElementById('print').hidden=true;document.getElementById('notice').textContent='';document.getElementById('result').textContent='';build();window.scrollTo({top:0,behavior:'smooth'});}
document.getElementById('submit').addEventListener('click',grade);document.getElementById('retake').addEventListener('click',retake);document.getElementById('print').addEventListener('click',()=>window.print());build();
</script></body></html>
