<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photoshop Certification Quiz — Part 3</title>
<style>body{font:17px system-ui,Arial;background:#eef3f8;color:#16283b;margin:0}.wrap{max-width:800px;margin:32px auto;background:white;padding:30px;border-radius:16px;box-shadow:0 8px 30px #1536571a}h1{font-size:26px;color:#075a98}.muted{color:#53677b}.question{font-size:22px;font-weight:650;margin:22px 0}.choice{display:block;border:1px solid #cbd6e2;border-radius:10px;padding:14px;margin:9px 0;cursor:pointer}.choice:has(input:checked){background:#e5f2ff;border-color:#0674c4}.choice input{margin-right:12px}button{background:#0877be;color:white;border:0;padding:12px 20px;border-radius:9px;font-weight:bold;cursor:pointer;margin:8px 6px 0 0}button:disabled{background:#aebac6;cursor:not-allowed}.progress{height:8px;background:#dce5ef;border-radius:6px;overflow:hidden}.bar{height:100%;background:#0877be}.result{padding:12px 16px;background:#eef5fa;border-radius:10px;margin:10px 0}.wrong{border-left:5px solid #ba4747}.right{border-left:5px solid #20845d}.notice{background:#fff3d8;border:1px solid #dfb85a;padding:12px;border-radius:8px}@media(max-width:600px){.wrap{margin:0;border-radius:0;padding:20px}}@media print{button{display:none}.wrap{box-shadow:none}}</style>
</head>
<body><main class="wrap"><h1>Adobe Photoshop Certification Practice Quiz — Part 3</h1><p class="muted">20 questions · Choose the requested number of answers · View your score after submitting.</p><div id="app"></div></main>
<script>
const questions=[{"q": "Which action temporarily disables a layer mask in Photoshop?", "options": ["Shift-click the mask thumbnail", "Ctrl+Shift+I", "Ctrl+Shift+M", "Ctrl+Shift+H"], "correct": [0]}, {"q": "Which File menu command lets you modify document copyright and author metadata?", "options": ["File > Export", "File > File Info", "File > Automate", "File > Print"], "correct": [1]}, {"q": "Before completing a Photoshop project, which three items should be reviewed?", "options": ["Swatches", "Dimensions and resolution", "Color mode", "Layer count", "Metadata"], "correct": [1, 2, 4]}, {"q": "In Photoshop print settings, which Color Handling choice assigns color management to Photoshop?", "options": ["Printer Manages Colors", "Photoshop Manages Colors", "No Color Management", "Convert to Grayscale"], "correct": [1]}, {"q": "Which three are benefits of cloud file storage?", "options": ["Autosave support", "Files are easily lost", "Files can be hacked", "Version history", "Sharing and access for collaborators"], "correct": [0, 3, 4]}, {"q": "What is an iterative sketch?", "options": ["A rough design concept revised over time", "A fixed project framework", "A final approved design", "A completed production file"], "correct": [0]}, {"q": "Which three are technical or output requirements to consider in a design project?", "options": ["Deliverables", "Resolution or DPI", "File types", "Company protocol", "Employee attendance"], "correct": [0, 1, 2]}, {"q": "A feedback ______ describes a repeated cycle of receiving feedback and revising a design.", "options": ["protocol", "form", "loop", "requirement"], "correct": [2]}, {"q": "Which is NOT a standard project production phase?", "options": ["Budget discussion", "Testing", "Planning and analysis", "Publishing"], "correct": [0]}, {"q": "Which four factors may be documented in a project plan?", "options": ["Statement", "Outcome", "Demographics", "Benchmarks", "Roles", "Scope"], "correct": [2, 3, 4, 5]}, {"q": "Which three are appropriate sources of project feedback?", "options": ["Peers", "Client", "Family", "Teammates", "Unmoderated internet comments"], "correct": [0, 1, 3]}, {"q": "Which color mode is most commonly used for web and video graphics?", "options": ["Grayscale", "Multichannel", "CMYK", "RGB (Red-Green-Blue)"], "correct": [3]}, {"q": "Which two effects of scope creep should stakeholders discuss?", "options": ["Separate accounts for new expectations", "Reduced quality as a requirement", "Additional resources", "Additional time"], "correct": [2, 3]}, {"q": "Which Photoshop panel lists the document layers, including shape layers and masks?", "options": ["Adjustments", "Layers", "History", "Info"], "correct": [1]}, {"q": "Which shortcut activates the Brush tool in Photoshop?", "options": ["Shift+B", "Ctrl", "B", "Ctrl+Shift+B"], "correct": [2]}, {"q": "What is the visible working area of a Photoshop document called?", "options": ["Workspace", "Artboard only", "Canvas", "Tab"], "correct": [2]}, {"q": "Which three actions can customize the layout of Photoshop panels?", "options": ["Nest or dock them", "Show them", "Report them", "Cast them", "Separate or undock them"], "correct": [0, 1, 4]}, {"q": "Under which Preferences category can you adjust Photoshop memory usage?", "options": ["Units & Rulers", "Interface", "Performance", "Guides, Grid & Slices"], "correct": [2]}, {"q": "Which panel is used to adjust typography properties such as font, size and tracking?", "options": ["Tools", "Info", "Brushes", "Character"], "correct": [3]}, {"q": "Where can you change the blend mode of a selected Photoshop layer?", "options": ["Paths panel", "Libraries panel", "Blend Mode dropdown in the Layers panel", "History panel"], "correct": [2]}];
let pos=0, answers=questions.map(()=>[]),done=false;
const el=document.getElementById('app');
function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function complete(i){return answers[i].length===questions[i].correct.length}
function setAnswer(i,checked){const a=answers[pos];if(questions[pos].correct.length===1)answers[pos]=[i];else answers[pos]=checked?[...new Set([...a,i])]:a.filter(x=>x!==i);render()}
function score(){return questions.reduce((n,q,i)=>n+(complete(i)&&q.correct.every(x=>answers[i].includes(x))?1:0),0)}
function submit(){const missing=questions.map((q,i)=>complete(i)?null:i+1).filter(x=>x!==null);if(missing.length){document.getElementById('notice').textContent='Please complete question'+(missing.length===1?' ':'s ')+missing.join(', ')+'. Each question must have the requested number of answers selected.';document.getElementById('notice').hidden=false;return}done=true;render();window.scrollTo({top:0,behavior:'smooth'})}
function render(){if(done){const s=score();el.innerHTML=`<h2>Your score: ${s} / ${questions.length} (${Math.round(s/questions.length*100)}%)</h2><p>Review your answers below.</p><button id="retake">Retake Quiz</button><button id="print">Print Results</button>`+questions.map((q,i)=>{const good=complete(i)&&q.correct.every(x=>answers[i].includes(x));return `<div class="result ${good?'right':'wrong'}"><b>${i+1}. ${esc(q.q)}</b><p>${good?'Correct':'Incorrect'} — Your answer: ${answers[i].length?answers[i].map(j=>esc(q.options[j])).join('; '):'Not answered'}</p><p><b>Correct:</b> ${q.correct.map(j=>esc(q.options[j])).join('; ')}</p></div>`}).join('');document.getElementById('retake').onclick=()=>{pos=0;answers=questions.map(()=>[]);done=false;render()};document.getElementById('print').onclick=()=>window.print();return}
const q=questions[pos],a=answers[pos],completed=questions.filter((_,i)=>complete(i)).length;
el.innerHTML=`<p class="muted">Question ${pos+1} of ${questions.length} · ${completed} fully completed</p><div class="progress"><div class="bar" style="width:${100*completed/questions.length}%"></div></div><div class="question">${esc(q.q)}</div><p class="muted">${q.correct.length>1?'Choose exactly '+q.correct.length+' answers.':'Choose one answer.'}</p>`+q.options.map((opt,i)=>`<label class="choice"><input type="${q.correct.length>1?'checkbox':'radio'}" name="choice" data-option="${i}" ${a.includes(i)?'checked':''}><b>${String.fromCharCode(65+i)}.</b> ${esc(opt)}</label>`).join('')+`<p id="notice" class="notice" role="alert" hidden></p><button id="prev" ${pos===0?'disabled':''}>Previous</button><button id="next">${pos===questions.length-1?'Submit & Score':'Next'}</button>`;
el.querySelectorAll('input[data-option]').forEach(input=>input.addEventListener('change',()=>setAnswer(Number(input.dataset.option),input.checked)));
document.getElementById('prev').onclick=()=>{pos--;render()};document.getElementById('next').onclick=()=>{if(pos===questions.length-1)submit();else{pos++;render()}};
}
render();
</script></body></html>
